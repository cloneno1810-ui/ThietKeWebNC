<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo</title>
  <link rel="stylesheet" href="/shared/layout.css">
  <script src="/shared/auth-guard.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/ui-wrapper.js"></script>
</head>
<body>
  <div class="toolbar">
    <div>
      <div class="page-h2">Báo cáo doanh thu</div>
      <p class="muted">Dành cho quản lý và quản trị viên</p>
    </div>
  </div>
  <div class="stats-row" id="rp-stats">
    <div class="stat-card">
      <div class="stat-icon" style="background:#e0f2fe;color:#0284c7"><i class="fa-solid fa-calendar-check"></i></div>
      <div class="stat-info"><p>Tổng đơn</p><h3 id="rp-total">0</h3></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#dcfce7;color:#166534"><i class="fa-solid fa-money-bill-wave"></i></div>
      <div class="stat-info"><p>Doanh thu dự kiến</p><h3 id="rp-rev">0 đ</h3></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fef3c7;color:#d97706"><i class="fa-solid fa-key"></i></div>
      <div class="stat-info"><p>Đơn hoàn tất</p><h3 id="rp-done">0</h3></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#dbeafe;color:#1d4ed8"><i class="fa-solid fa-user-shield"></i></div>
      <div class="stat-info"><p>Người xem</p><h3 id="rp-user">-</h3></div>
    </div>
  </div>
  <div class="panel-card">
    <p class="muted" id="rp-desc">Đang tải báo cáo...</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => setTimeout(async () => {
      const res = await API.request('/api/v1/reports/revenue');
      if (res.status !== 200) {
        showToast('Không tải được báo cáo', res.data.error && res.data.error.message);
        document.getElementById('rp-desc').textContent = 'Bạn không có quyền xem báo cáo này.';
        return;
      }
      const d = res.data.data;
      const r = d.report || {};
      document.getElementById('rp-total').textContent = r.total_bookings || 0;
      document.getElementById('rp-rev').textContent = Number(r.expected_revenue || 0).toLocaleString('vi-VN') + ' đ';
      document.getElementById('rp-done').textContent = r.completed_bookings || 0;
      document.getElementById('rp-user').textContent = d.user || '-';
      document.getElementById('rp-desc').textContent = d.description || '';
    }, 50));
  </script>
</body>
</html>
