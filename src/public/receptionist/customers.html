<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khách hàng</title>
  <link rel="stylesheet" href="/shared/layout.css">
  <script src="/shared/auth-guard.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/ui-wrapper.js"></script>
<link rel="stylesheet" href="/shared/accessibility.css">
<script src="/shared/accessibility.js" defer></script>
<meta name="description" content="Danh sách khách lưu trú dành cho nhân viên DT07 Hotel.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="toolbar">
    <div>
      <h1 class="page-h2">Hồ sơ khách hàng</h1>
      <p class="muted">Danh sách tài khoản vai trò khách</p>
    </div>
  </div>
  <table class="data-table">
    <thead>
      <tr><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>CCCD</th><th>Thao tác</th></tr>
    </thead>
    <tbody id="cus-body"></tbody>
  </table>

  <script>
    let rows = [];
    async function loadCustomers() {
      const res = await API.request('/api/v1/customers');
      if (res.status !== 200) {
        showToast('Không tải được danh sách', res.data.error && res.data.error.message);
        return;
      }
      rows = res.data.data.customers || [];
      render(rows);
    }
    function render(list) {
      document.getElementById('cus-body').innerHTML = list.map((c) =>
        '<tr><td>' + Security.escapeHtml(c.full_name) + '</td><td>' + Security.escapeHtml(c.email) + '</td><td>' + Security.escapeHtml(c.phone || '-') + '</td><td>' + Security.escapeHtml(c.identity_card || '-') + '</td>' +
        '<td><button type="button" class="btn-icon" title="Gọi khách" data-call-customer="' + Security.escapeHtml(c.phone || '') + '"><i class="fa-solid fa-phone"></i></button></td></tr>'
      ).join('') || '<tr><td colspan="5">Chưa có khách hàng.</td></tr>';
      document.querySelectorAll('[data-call-customer]').forEach((button) => {
        button.addEventListener('click', () => callCustomer(button.dataset.callCustomer));
      });
    }
    function callCustomer(phone) {
      if (!/^[0-9+ -]{7,20}$/.test(phone)) { showToast('Số điện thoại không hợp lệ'); return; }
      window.location.href = 'tel:' + phone;
    }
    window.addEventListener('app:search', (e) => {
      const q = (e.detail || '').toLowerCase();
      render(rows.filter((c) => (c.full_name + c.email + (c.phone || '')).toLowerCase().indexOf(q) !== -1));
    });
    document.addEventListener('DOMContentLoaded', () => setTimeout(loadCustomers, 50));
  </script>
</body>
</html>
